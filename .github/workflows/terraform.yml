name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================================
  # TERRAFORM PLAN
  # ==========================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: env/dev
        shell: powershell

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Check Azure Variables
      # --------------------------------------------------------
      - name: Check Azure Variables
        shell: powershell
        run: |
          if ([string]::IsNullOrEmpty("${{ vars.AZURE_CLIENT_ID }}")) {
            Write-Host "AZURE_CLIENT_ID is EMPTY"
          }
          else {
            Write-Host "AZURE_CLIENT_ID is SET"
          }

          if ([string]::IsNullOrEmpty("${{ vars.AZURE_CLIENT_SECRET }}")) {
            Write-Host "AZURE_CLIENT_SECRET is EMPTY"
          }
          else {
            Write-Host "AZURE_CLIENT_SECRET is SET"
          }

          if ([string]::IsNullOrEmpty("${{ vars.AZURE_TENANT_ID }}")) {
            Write-Host "AZURE_TENANT_ID is EMPTY"
          }
          else {
            Write-Host "AZURE_TENANT_ID is SET"
          }

          if ([string]::IsNullOrEmpty("${{ vars.AZURE_SUBSCRIPTION_ID }}")) {
            Write-Host "AZURE_SUBSCRIPTION_ID is EMPTY"
          }
          else {
            Write-Host "AZURE_SUBSCRIPTION_ID is SET"
          }

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------
      - name: Azure Login
        shell: powershell
        run: |
          az login `
            --service-principal `
            --username "${{ vars.AZURE_CLIENT_ID }}" `
            --password "${{ vars.AZURE_CLIENT_SECRET }}" `
            --tenant "${{ vars.AZURE_TENANT_ID }}"

      - name: Set Azure Subscription
        shell: powershell
        run: |
          az account set `
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Check Azure Login
        shell: powershell
        run: |
          az account show

      # --------------------------------------------------------
      # Terraform Checks
      # --------------------------------------------------------
      - name: Terraform Format
        run: |
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Validate
        run: |
          terraform validate

      # --------------------------------------------------------
      # TFLint
      # --------------------------------------------------------
      - name: Check TFLint
        shell: powershell
        run: |
          tflint --version

      - name: TFLint Init
        shell: powershell
        run: |
          tflint --init

      - name: TFLint
        shell: powershell
        run: |
          tflint
      # --------------------------------------------------------
      # tfsec
      # --------------------------------------------------------
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: env/dev

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        run: |
          terraform plan


  # ==========================================================
  # TERRAFORM APPLY
  # ==========================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform-plan

    # Apply ONLY after code is pushed/merged into main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: env/dev
        shell: powershell

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------
      - name: Azure Login
        shell: powershell
        run: |
          az login `
            --service-principal `
            --username "${{ vars.AZURE_CLIENT_ID }}" `
            --password "${{ vars.AZURE_CLIENT_SECRET }}" `
            --tenant "${{ vars.AZURE_TENANT_ID }}"

      - name: Set Azure Subscription
        shell: powershell
        run: |
          az account set `
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Check Azure Login
        shell: powershell
        run: |
          az account show

      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve tfplan