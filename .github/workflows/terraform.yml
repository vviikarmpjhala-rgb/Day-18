name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: env/dev

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "${{ vars.AZURE_CLIENT_ID }}" \
            --password "${{ vars.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ vars.AZURE_TENANT_ID }}"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint

      - name: tfsec
        run: tfsec .

      - name: Terraform Plan
        run: terraform plan